name: Validate multi-email implementation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-multi-email.yml
      - admin.html
      - admin-multi-email.js
      - deno.json
      - scripts/apply-multi-email.py
      - scripts/deploy-multi-email.sh
      - supabase/functions/**/index.ts
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm admin module is linked
        run: |
          python3 scripts/apply-multi-email.py
          git diff --exit-code -- admin.html

      - name: Validate browser JavaScript
        run: node --check admin-multi-email.js

      - name: Validate deployment script
        run: bash -n scripts/deploy-multi-email.sh

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Supabase Edge Functions
        run: |
          deno check supabase/functions/create-client/index.ts
          deno check supabase/functions/process-invoice/index.ts
          deno check supabase/functions/send-invoice-notification/index.ts
          deno check supabase/functions/send-custom-email/index.ts
          deno check supabase/functions/send-collection-email/index.ts
          deno check supabase/functions/notify-ticket-update/index.ts

      - name: Validate whitespace
        run: git diff --check origin/main...HEAD
