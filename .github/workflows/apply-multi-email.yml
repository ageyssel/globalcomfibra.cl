name: Validate multi-email implementation

on:
  push:
    branches:
      - mejora/globalcom-produccion
    paths:
      - .github/workflows/apply-multi-email.yml
      - admin-multi-email.js
      - scripts/apply-multi-email.py
      - supabase/functions/**/index.ts
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: mejora/globalcom-produccion
          fetch-depth: 0

      - name: Link multi-email module
        run: python3 scripts/apply-multi-email.py

      - name: Validate browser JavaScript
        run: node --check admin-multi-email.js

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Supabase Edge Functions
        run: |
          deno check supabase/functions/create-client/index.ts
          deno check supabase/functions/process-invoice/index.ts
          deno check supabase/functions/send-invoice-notification/index.ts
          deno check supabase/functions/send-custom-email/index.ts
          deno check supabase/functions/send-collection-email/index.ts
          deno check supabase/functions/notify-ticket-update/index.ts

      - name: Validate diff
        run: git diff --check

      - name: Commit generated change
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "feat: activar múltiples correos en panel administrador"
          git push origin HEAD:mejora/globalcom-produccion
